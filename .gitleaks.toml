# Secret scanning rules for airdrop-claim.
#
# The default Gitleaks ruleset does NOT reliably catch two things this project
# handles constantly:
#   1. an EVM private key   (0x + 64 hex) — looks identical to a transaction hash
#   2. a keystore/keypair JSON blob
# Both are added below. See docs/01-技术方案.md §10.

title = "airdrop-claim"
description = "Secret scanning for an EVM airdrop payout system"

[extend]
# Keep the upstream ruleset; we only add the EVM-specific gaps.
useDefault = true

# ---------------------------------------------------------------------------
# EVM secrets
# ---------------------------------------------------------------------------

[[rules]]
id = "evm-private-key-assigned"
description = "EVM private key assigned to a key-like variable"
# Anchored on the variable name on purpose: a bare 0x+64hex is indistinguishable
# from a transaction hash, so requiring key-ish context keeps false positives out.
regex = '''(?i)(?:private[_-]?key|priv[_-]?key|deployer[_-]?key|operator[_-]?key|signer[_-]?key|wallet[_-]?key|secret[_-]?key|mnemonic)["'\s]{0,6}[:=]["'\s]{0,6}(0x[0-9a-fA-F]{64})'''
secretGroup = 1
entropy = 3.0
tags = ["key", "evm"]

[[rules]]
id = "evm-keystore"
description = "Ethereum keystore (V3) JSON contents"
regex = '''"ciphertext"\s*:\s*"[0-9a-fA-F]{64,}"'''
tags = ["key", "evm", "keystore"]

[[rules]]
id = "raw-keypair-array"
description = "Raw keypair serialized as a JSON array of 64 byte values"
# Each element is constrained to the byte range 0-255. The looser \d{1,3} form
# matched TypeScript incremental-build caches, which are full of small integer
# arrays and produced false positives on every build.
regex = '''\[\s*(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\s*,\s*(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){63}\s*\]'''
tags = ["key", "keypair"]

# ---------------------------------------------------------------------------
# Third-party credentials used by this project
# ---------------------------------------------------------------------------

[[rules]]
id = "x-api-client-secret"
description = "X/Twitter OAuth client secret"
regex = '''(?i)(?:x_?client_?secret|twitter_?client_?secret|oauth_?client_?secret)["'\s]{0,6}[:=]["'\s]{0,6}([A-Za-z0-9_\-]{30,})'''
secretGroup = 1
tags = ["key", "third-party"]

[[rules]]
id = "bscscan-api-key"
description = "BscScan / Etherscan style API key"
regex = '''(?i)(?:bscscan|etherscan|explorer)_?api_?key["'\s]{0,6}[:=]["'\s]{0,6}([A-Z0-9]{20,})'''
secretGroup = 1
tags = ["key", "third-party"]

[[rules]]
id = "database-url-with-password"
description = "Postgres connection string containing a password"
regex = '''postgres(?:ql)?://[^\s:@/]+:[^\s:@/]+@'''
tags = ["key", "database"]

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------

[allowlist]
description = "Files that legitimately contain placeholder or fixture values"
paths = [
  # .env.example carries key NAMES only — never values.
  '''(^|/)\.env\.example$''',
  # Test fixtures use obviously-fake, low-entropy values.
  '''(^|/)test/fixtures/.*\.json$''',
  # Documentation shows redacted examples.
  '''(^|/)docs/.*\.md$''',
  # Build output and caches: generated identifiers and integer arrays trip the
  # generic rules and are never a source of real secrets.
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.open-next/''',
  '''(^|/)coverage/''',
  '''(^|/)artifacts/''',
  '''(^|/)typechain-types/''',
  '''\.tsbuildinfo$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
regexes = [
  # Redacted placeholders used in docs and examples.
  '''0x0{64}''',
  '''0x1{64}''',
  '''(?i)your[_-]?(private[_-]?key|api[_-]?key|secret)[_-]?here''',
]
