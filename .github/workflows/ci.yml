name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Least privilege: the workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checklist requires scanning the ENTIRE history, not just HEAD.
          fetch-depth: 0

      # The binary is downloaded and checksum-verified rather than pulled in via
      # a third-party action: the project conventions forbid unverified binaries,
      # and the official action requires a paid licence for GitHub organisations.
      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks

      - name: Scan full git history
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --log-opts="--all"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Semgrep stands in for CodeQL while the repository is private: code
      # scanning on private repos needs GitHub Advanced Security, which the
      # personal Pro plan does not include. CodeQL is wired up in codeql.yml
      # and activates automatically once the repository is public.
      - name: Install Semgrep
        run: pip install --disable-pip-version-check "semgrep==1.179.0"

      - name: Scan
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/secrets \
            --exclude node_modules \
            --exclude .next \
            --error \
            --quiet

  verify:
    name: Verify (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Integration tests need a real Postgres. Enabled in M1, when the first
      # migration and its tests land.
      #
      # services:
      #   postgres:
      #     image: postgres:16-alpine
      #     env:
      #       POSTGRES_PASSWORD: postgres
      #     ports: ["5432:5432"]
      #     options: >-
      #       --health-cmd pg_isready --health-interval 5s
      #       --health-timeout 5s --health-retries 10
