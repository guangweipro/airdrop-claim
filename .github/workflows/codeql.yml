name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # Code scanning on a PRIVATE repository requires GitHub Advanced Security,
    # which the personal Pro plan does not include. While this repository is
    # private the job is skipped; it activates by itself the moment the
    # repository is made public (M11), where CodeQL is free.
    #
    # Semgrep runs in ci.yml and covers SAST in the meantime — the project
    # conventions accept an equivalent SAST tool.
    if: ${{ !github.event.repository.private }}

    strategy:
      fail-fast: false
      matrix:
        # Only the languages this repository actually contains.
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
