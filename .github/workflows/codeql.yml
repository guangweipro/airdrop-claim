name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # Code scanning on a PRIVATE repository requires GitHub Advanced Security,
    # which the personal Pro plan does not include. While this repository is
    # private the job is skipped; it activates by itself the moment the
    # repository is made public (M11), where CodeQL is free.
    #
    # Semgrep runs in ci.yml and covers SAST in the meantime — the project
    # conventions accept an equivalent SAST tool.
    if: ${{ !github.event.repository.private }}

    strategy:
      fail-fast: false
      matrix:
        # Only the languages this repository actually contains.
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
